name: THT-Chat+ APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Derleme ve APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Java 11 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/**/*.gradle*', 'src/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Debug APK oluştur
        run: bash ./gradlew assembleDebug --stacktrace
      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: tht-chat-plus-debug
          path: src/app/build/outputs/apk/debug/app-debug.apk